replicaCount: 1
image:
  api: ghcr.io/it4nodummies/heureum-api:latest
  worker: ghcr.io/it4nodummies/heureum-worker:latest
  frontend: ghcr.io/it4nodummies/heureum-frontend:latest
config:
  appSecret: ""
  dbDriver: postgres
  dbDsn: "postgres://heureum:heureum@postgres:5432/heureum?sslmode=disable"
  redisUrl: "redis://redis:6379/0"
  baseUrl: "http://localhost"
  # Public registration policy: "closed" (default — registration is accepted
  # only while the instance has no active admin, and that user becomes admin)
  # or "open".
  signup: "closed"
  # Outgoing webhooks refuse private/loopback/link-local targets (SSRF). Comma-
  # separated hosts, IPs or CIDRs to allow anyway, e.g. "forgejo.home.arpa,10.42.0.0/16".
  # A hostname entry is trusted wherever it resolves (loopback/link-local included);
  # an IP/CIDR entry lifts the restriction only for that range.
  webhookAllowPrivateHosts: ""
  # Reverse proxies (IPs/CIDRs, comma-separated) whose X-Forwarded-For is trusted
  # for auth rate limiting — typically the ingress controller's pod CIDR, e.g.
  # "10.42.0.0/16". Empty: the header is ignored and the peer address is the client.
  trustedProxies: ""
  smtpHost: ""
ingress:
  enabled: false
  host: jira.example.com
uploads:
  dir: /data/uploads
  persistence:
    enabled: true
    size: 5Gi
postgresql:
  enabled: false
redis:
  enabled: false
